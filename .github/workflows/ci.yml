name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: credd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d credd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/credd_test
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint:check

      - name: Build
        run: pnpm build

      - name: Check documentation links
        run: pnpm check:links

      # Fast PGlite suites plus real PostgreSQL contention tests.
      - name: Test
        run: pnpm test
