name: Deploy RPG Bot

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # Chạy lại toàn bộ kiểm tra (lint → build → test) ngay trên runner VPS với
  # đúng commit sắp deploy — fail ở đâu thì dừng ở đó, bot không bao giờ chạy
  # code chưa qua kiểm tra.
  ci-verify:
    runs-on: self-hosted
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  ship:
    needs: ci-verify
    runs-on: self-hosted
    steps:
      - name: Deploy RPG Bot
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -e

          cd /opt/apps/rpg-bot

          echo ">>> Fetching verified commit $DEPLOY_SHA"
          git fetch origin "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"

          echo ">>> Building Docker image"
          docker compose build

          echo ">>> Starting bot (entrypoint runs migrate → seed → deploy commands)"
          docker compose up -d

          echo ">>> Status"
          docker compose ps

          echo ">>> Cleaning unused images"
          docker image prune -f
